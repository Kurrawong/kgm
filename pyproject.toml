[project]
name = "kgm"
version = "2.1.0"
description = "A Python package that provides a series of functions to work with KGs & RDF files."
authors = [{ name = "Nicholas Car", email = "nick@kurrawong.ai" }]
requires-python = ">=3.12,<4.0"
readme = "README.md"
license = "BSD-3-Clause"
dependencies = [
    "kurra>=3.0.4",
    "typer>=0.15.1,<0.16",
    "dateutils>=0.6.12",
    "gitpython>=3.1.45",
    "rdflib>=7.6.0",
    "rdf-delta>=0.2.5",
]

[project.scripts]
kgm = "kgm.cli:app"

[project.optional-dependencies]
azure = [
    "azure-servicebus>=7.14.3",
]

[dependency-groups]
dev = [
    "black>=25.1.0",
    "mkdocstrings-python",
    "pytest>=9.0.3,<10",
    "ruff>=0.9.4",
    "testcontainers>=4.9.0,<5",
    "zensical>=0.0.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
